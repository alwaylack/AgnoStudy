    "mcp>=1.27.1",
    "openai>=2.30.0",
    "pycountry>=26.2.16",
    "pydantic>=2.0.0",
    "pypdf>=5.0.0",
    "python-dotenv>=1.0.0",
    "reportlab>=4.0.0",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.44.0",
]
